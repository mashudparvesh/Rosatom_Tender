name: Rosatom Tender Auto-Sync

on:
  schedule:
    # Runs every 2 hours from Monday to Friday (Skips Saturday & Sunday)
    # Cron format: Minute Hour Day Month DayOfWeek (1-5 = Mon-Fri)
    - cron: '0 5-17/2 * * 1-5'
  workflow_dispatch: # Allows you to run it manually anytime from GitHub!

jobs:
  sync-tenders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 gspread oauth2client

      - name: Run Python Scraper
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python scraper.py
